<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>AI Buddy</title>
    <style>
      :root {
        --bg: #090d16;
        --surface: #101625;
        --surface-card: #151d30;
        --border: rgba(255, 255, 255, 0.08);
        --border-hover: rgba(255, 255, 255, 0.16);
        --accent: #6366f1;
        --accent-hover: #4f46e5;
        --ring: rgba(99, 102, 241, 0.65);
        --text: #f8fafc;
        --text-muted: #94a3b8;
        --radius-sm: 6px;
        --radius-md: 10px;
      }
      :focus-visible {
        outline: 2px solid var(--ring);
        outline-offset: 2px;
      }
      body {
        width: 340px;
        margin: 0;
        font:
          13px/1.5 -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          Roboto,
          sans-serif;
        background: var(--bg);
        color: var(--text);
      }
      .wrap {
        padding: 14px;
        display: grid;
        gap: 10px;
      }
      header {
        display: flex;
        align-items: center;
        gap: 8px;
        font-weight: 600;
      }
      textarea {
        width: 100%;
        box-sizing: border-box;
        min-height: 64px;
        border-radius: var(--radius-md);
        border: 1px solid var(--border);
        background: var(--surface);
        color: inherit;
        padding: 8px 10px;
        font: inherit;
        resize: vertical;
      }
      textarea::placeholder {
        color: var(--text-muted);
      }
      button {
        border: 0;
        border-radius: var(--radius-sm);
        padding: 8px 12px;
        font: inherit;
        cursor: pointer;
        background: var(--accent);
        color: #ffffff;
        font-weight: 600;
        transition:
          background 0.15s ease,
          border-color 0.15s ease;
      }
      button:hover:not(:disabled) {
        background: var(--accent-hover);
      }
      button.ghost {
        background: transparent;
        color: var(--text-muted);
        border: 1px solid var(--border);
      }
      button.ghost:hover:not(:disabled) {
        background: rgba(255, 255, 255, 0.04);
        border-color: var(--border-hover);
        color: var(--text);
      }
      .row {
        display: flex;
        gap: 6px;
        flex-wrap: wrap;
      }
      .answer {
        white-space: pre-wrap;
        background: var(--surface-card);
        border: 1px solid var(--border);
        border-radius: var(--radius-md);
        padding: 10px;
        line-height: 1.45;
      }
      .muted {
        color: var(--text-muted);
        font-size: 12px;
      }
      [hidden] {
        display: none !important;
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <header style="display: flex; justify-content: space-between; align-items: center">
        <div style="display: flex; align-items: center; gap: 8px">
          <img src="icons/icon48.png" width="24" height="24" alt="" /> AI Buddy
        </div>
        <button id="openSidePanel" class="ghost" style="padding: 4px 8px; font-size: 11px">
          Side panel ↗
        </button>
      </header>
      <div id="healthLine" class="muted" style="font-size: 11px">Checking backend &amp; AI…</div>
      <div id="signedOut" hidden>
        <p style="margin: 0 0 8px">Connect your account or continue in Guest Mode.</p>
        <div class="row">
          <button id="connect">Connect account</button>
          <button id="useGuest" class="ghost">Use Guest Mode</button>
        </div>
      </div>
      <div id="signedIn" hidden>
        <div class="row">
          <button class="ghost" data-q="Explain this page simply." data-i="explain_page">
            Explain page
          </button>
          <button class="ghost" data-q="What should I do next on this page?" data-i="plan">
            Next step
          </button>
        </div>
        <textarea id="q" placeholder="Ask anything or type a page task…"></textarea>
        <div class="row">
          <button id="send">Ask Buddy</button>
          <button class="ghost" id="upgradeConnect" hidden>Connect account</button>
          <button class="ghost" id="signout">Sign out</button>
        </div>
        <div id="status" class="muted"></div>
        <div id="answer" class="answer" hidden></div>
        <div id="who" class="muted"></div>
      </div>
    </div>
    <script src="popup.js"></script>
  </body>
</html>
